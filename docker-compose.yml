version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis_broker
    ports:
      - "6379:6379"
     
  api:
    build: .
    container_name: fastapi_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
        
  worker:
    build: .
    container_name: celery_worker
    command: celery -A tasks.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
